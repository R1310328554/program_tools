name: Nightly Tool Scan

# 01:00 Asia/Shanghai == 17:00 UTC
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly discovery scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/nightly_tool_scan.py --live-github --create-issue

      - name: Commit scan artifacts
        run: |
          git config user.name "stackbox-bot"
          git config user.email "stackbox-bot@users.noreply.github.com"
          git add toolbox/discovery/candidates.json reports || true
          if git diff --staged --quiet; then
            echo "No scan artifact changes"
          else
            git commit -m "chore: nightly tool scan $(date -u +%Y-%m-%d)"
            git push
          fi
